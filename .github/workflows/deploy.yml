name: Deploy indexer

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-indexer-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect indexer changes
    runs-on: ubuntu-latest
    outputs:
      deploy_indexer: ${{ steps.detect.outputs.deploy_indexer }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deploy target
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          deploy_indexer=false
          reasons=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            deploy_indexer=true
            reasons+=("manual:indexer")
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"

            if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              deploy_indexer=true
              reasons+=("push:unknown-base")
            else
              mapfile -t changed_files < <(git diff --name-only "$before" "$after")

              for file in "${changed_files[@]}"; do
                case "$file" in
                  packages/indexer/*|Dockerfile.indexer)
                    deploy_indexer=true
                    reasons+=("indexer:$file")
                    ;;
                  packages/shared/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|.dockerignore)
                    deploy_indexer=true
                    reasons+=("shared:$file")
                    ;;
                esac
              done
            fi
          fi

          reason="$(IFS=,; echo "${reasons[*]:-no-indexer-changes}")"
          {
            echo "deploy_indexer=$deploy_indexer"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          echo "Deploy indexer: $deploy_indexer"
          echo "Reason: $reason"

  deploy:
    name: Deploy production indexer
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.deploy_indexer == 'true'
    environment: production
    timeout-minutes: 90
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DOCKER_REGISTRY_USERNAME: ${{ vars.DOCKER_REGISTRY_USERNAME }}
      INDEXER_HOST: ${{ vars.INDEXER_HOST }}
      VVORK_PROJECT: ${{ vars.VVORK_PROJECT }}
      VVORK_REPO: ${{ vars.VVORK_REPO }}
      PONDER_RPC_REQUESTS_PER_SECOND_1: ${{ vars.PONDER_RPC_REQUESTS_PER_SECOND_1 }}
      PONDER_ETH_GET_LOGS_BLOCK_RANGE_1: ${{ vars.PONDER_ETH_GET_LOGS_BLOCK_RANGE_1 }}
      PONDER_VIEWS_SCHEMA: ${{ vars.PONDER_VIEWS_SCHEMA }}
      DATABASE_SCHEMA: ''
      POSTGRES_SERVICE: ${{ vars.POSTGRES_SERVICE }}
      POSTGRES_DATA: ${{ vars.POSTGRES_DATA }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      PONDER_RPC_URLS_1: ${{ secrets.PONDER_RPC_URLS_1 }}
      PONDER_RPC_FALLBACK_URLS_1: ${{ secrets.PONDER_RPC_FALLBACK_URLS_1 }}
      PONDER_WS_URL_1: ${{ secrets.PONDER_WS_URL_1 }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mask deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SSH_PRIVATE_KEY \
            KAMAL_REGISTRY_PASSWORD \
            PONDER_RPC_URLS_1 \
            PONDER_RPC_FALLBACK_URLS_1 \
            PONDER_WS_URL_1 \
            DATABASE_URL \
            POSTGRES_PASSWORD
          do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              while IFS= read -r line; do
                if [[ -n "$line" ]]; then
                  echo "::add-mask::$line"
                fi
              done <<< "$value"

              for part in $value; do
                echo "::add-mask::$part"
              done
            fi
          done

      - name: Validate deploy environment
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DEPLOY_HOST
            DEPLOY_USER
            DOCKER_REGISTRY_USERNAME
            INDEXER_HOST
            VVORK_PROJECT
            VVORK_REPO
            PONDER_RPC_REQUESTS_PER_SECOND_1
            PONDER_ETH_GET_LOGS_BLOCK_RANGE_1
            PONDER_VIEWS_SCHEMA
            POSTGRES_SERVICE
            POSTGRES_DATA
            SSH_PRIVATE_KEY
            KAMAL_REGISTRY_PASSWORD
            PONDER_RPC_URLS_1
            DATABASE_URL
            POSTGRES_PASSWORD
          )

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production env values: %s\n' "${missing[*]}" >&2
            exit 78
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          scan="$(ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null)"
          fingerprint="$(printf '%s\n' "$scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          expected="SHA256:9cDQ7QtAMCDGaj24JDxIaAyMUf5YMLh36jz8hjfwmNk"

          if [[ "$fingerprint" != "$expected" ]]; then
            echo "Unexpected ED25519 host fingerprint for $DEPLOY_HOST: $fingerprint" >&2
            exit 68
          fi

          printf '%s\n' "$scan" > ~/.ssh/known_hosts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal -v 2.12.0 --no-document

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Render Kamal config
        working-directory: packages/indexer
        run: kamal config > "$RUNNER_TEMP/indexer-kamal.yml"

      - name: Deploy indexer
        working-directory: packages/indexer
        run: kamal deploy

      - name: Verify indexer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "https://${INDEXER_HOST}/ready" --output /dev/null
          curl --fail --silent --show-error --max-time 30 "https://${INDEXER_HOST}/collections" --output /dev/null
